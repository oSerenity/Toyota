<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Style-Type" content="text/css">
  <link rel="stylesheet" type="text/css" href="disp.css">
  <script src="sub.js"></script>
  <title>CAMRY</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      position: relative;
    }
    .content {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }
    .container {
      position: absolute;
      bottom: 60%;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
    }
    .cartitle {
      color: #cf0000;
      font-size: 24px;
      font-weight: bold;
    }
    .footer {
      color: #000000;
      font-family: Arial, sans-serif;
      font-size: x-small;
      position: absolute;
      bottom: 0;
      right: 5px;
    }
    iframe {
      width: 100%;
      height: calc(100% - 60px);
      border: none;
      display: none; /* Initially hidden */
    }
  </style>
  <script type="text/javascript">
    function getQueryVariable(variable) {
      var query = window.location.search.substring(1);
      var vars = query.split("&");
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split("=");
        if (pair[0] === variable) {
          return decodeURIComponent(pair[1]);
        }
      }
      return false;
    }

    function loadPDF() {
      var pdfUrl = getQueryVariable("url");
      if (pdfUrl) {
        openPDFInFrame(pdfUrl);
      }
    }

    function openPDFInFrame(url) {
      var iframe = document.getElementById("pdfFrame");
      iframe.src = url;
      iframe.style.display = "block"; // Show the iframe
      document.querySelector('.container').style.display = 'none'; // Hide the initial content
    }

    window.addEventListener('load', loadPDF);
  </script>
</head>
<body class="bg01">
  <div class="content">
    <div class="container">
      <p class="cartitle">CAMRY PDF Manual</p>
      <table border="0" cellpadding="2" cellspacing="0" align="center">
        <tr>
          <td valign="top">Applicable models</td>
          <td align="center" valign="top"><b>:</b></td>
          <td>ACV30, 31 series<br>MCV30 series</td>
        </tr>
      </table>
      <p>Click the desired item from the pull down menu on the left.</p>
      <table border="0" cellpadding="2" cellspacing="0" align="center">
        <tr>
          <td valign="top">Note:</td>
          <td>Please wait until the pull down menu is displayed.<br></td>
        </tr>
      </table>
    </div>
    <iframe id="pdfFrame" src="" title="PDF viewer"></iframe>
  </div>
  <p class="footer">Copyright &copy; 2003-2004 Toyota Motor Corporation. All rights reserved.</p>
</body>
</html>
