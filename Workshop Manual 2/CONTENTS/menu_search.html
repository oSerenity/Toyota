<SCRIPT type="text/javascript">
// The frame layout lives in index3.html; its framesets are found by id, so these
// buttons keep working if the layout changes.
var MIN_WIDTH = 200;
var DEFAULT_WIDTH = 260;
var lastWidth = DEFAULT_WIDTH;

function layout(id) {
  return parent.document.getElementById(id);
}

function menuWidth() {
  var cols = layout("fsColumns");
  return cols ? parseInt(cols.getAttribute("cols"), 10) || 0 : 0;
}

function setMenuWidth(width) {
  var cols = layout("fsColumns");
  if (cols) cols.setAttribute("cols", width + ",*");
}

// TREE CLOSE: hide the menu column and show the TREE OPEN bar under the viewer.
function frameclose() {
  if (menuWidth() > 0) lastWidth = menuWidth();
  setMenuWidth(0);
  var right = layout("fsRight");
  if (right) right.setAttribute("rows", "*,33");
}

// TREE OPEN (frameopen.html): bring the menu back at its previous width.
function frameopen() {
  setMenuWidth(lastWidth || DEFAULT_WIDTH);
  var right = layout("fsRight");
  if (right) right.setAttribute("rows", "*,0");
}

// Narrower / wider buttons.
function frameresizewidth(addsize) {
  var max = Math.max(MIN_WIDTH, Math.round(parent.innerWidth * 0.7));
  var width = Math.min(max, Math.max(MIN_WIDTH, menuWidth() + addsize));
  lastWidth = width;
  setMenuWidth(width);
}

function setbtnimage(status, PsBaseFile, PoObj){
  if (status==0) {
	document.images[PoObj].src='./images/' + PsBaseFile + '1.gif';
  }else if (status==1) {
	document.images[PoObj].src='./images/' + PsBaseFile + '2.gif';
  }else{
	document.images[PoObj].src='./images/' + PsBaseFile + '3.gif';
  }
}
//-->
</SCRIPT>
