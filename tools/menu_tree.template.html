    <style>
        /* Recreates the original menu's look (tree.css): 8pt Arial, +/- boxes and coloured book icons. */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0 6px 16px;
            background-color: #ccd5da;
            color: #000;
            font-family: Arial, "Helvetica Neue", sans-serif;
            font-size: 8pt;
            line-height: 1.35;
        }
        .TopItem {
            display: block;
            text-align: left;
            margin: 6px 0 4px;
            padding: 0;
            border: 0;
            background: none;
            color: #000;
            font: bold 14pt Arial, sans-serif;
            cursor: pointer;
        }
        .TopItem small {
            display: block;
            color: #3d4a52;
            font-size: 7.5pt;
            font-weight: normal;
        }
        #menuTree ul {
            list-style: none;
            margin: 0;
            padding: 0 0 0 10px; /* one tg*.gif spacer per level */
        }
        #menuTree > ul {
            padding-left: 0;
        }
        #menuTree li {
            white-space: nowrap;
        }
        #menuTree summary {
            display: flex;
            align-items: center;
            min-height: 18px;
            cursor: pointer;
            list-style: none;
        }
        #menuTree summary::-webkit-details-marker {
            display: none;
        }
        #menuTree summary:hover span {
            color: #f00;
        }
        #menuTree img {
            flex: none;
            border: 0;
            vertical-align: middle;
        }
        #menuTree img.tog {
            margin-right: 2px;
        }
        #menuTree img.book {
            margin-right: 2px;
        }
        /* Items line up with the text of their sibling sections (13px box + 2px). */
        #menuTree a {
            display: inline-block;
            padding: 1px 0 1px 15px;
            text-decoration: none;
        }
        a.pdf, a.pdf:link, a.pdf:visited { color: #000; }
        a.sup, a.sup:link, a.sup:visited { color: #009900; }
        a.sb, a.sb:link, a.sb:visited { color: #333399; }
        #menuTree a:hover { color: #f00; }
        #menuTree a[aria-current="page"] { font-weight: bold; }
        a:focus-visible,
        summary:focus-visible,
        .TopItem:focus-visible {
            outline: 2px solid #cf0000;
            outline-offset: 1px;
        }
    </style>
    <script>
        // The viewer lives in the sibling "pdf" frame (pdf.html); forward clicks to it.
        // If the menu is opened on its own, open the PDF directly instead.
        function openPDFInFrame(url) {
            var viewer = parent && parent !== window && parent.frames ? parent.frames["pdf"] : null;
            if (viewer && typeof viewer.openPDFInFrame === "function") {
                viewer.openPDFInFrame(url);
            } else {
                window.open(url, "_blank");
            }
        }

        // Closes every section. Called by the RESET button (menu_search.html) and the title.
        function AllClose() {
            document.querySelectorAll("#menuTree details[open]").forEach(function (d) {
                d.open = false;
            });
        }

        // Swap the +/- box and open/closed book icons when a section opens or closes.
        document.addEventListener("toggle", function (event) {
            var details = event.target;
            if (!details.matches || !details.matches("#menuTree details")) return;
            details.querySelectorAll(":scope > summary > img[data-open]").forEach(function (img) {
                img.src = img.getAttribute(details.open ? "data-open" : "data-closed");
            });
        }, true);

        // Plain left-clicks on a document link open it in the viewer; modified clicks
        // (new tab, etc.) keep the browser's default behaviour.
        document.addEventListener("click", function (event) {
            var link = event.target.closest && event.target.closest("a[data-doc]");
            if (!link || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) {
                return;
            }
            event.preventDefault();
            openPDFInFrame(link.getAttribute("href"));
        });
    </script>
