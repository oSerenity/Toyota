<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Generated by tools/build_viewers.py. Edit the template or the manual's menu, not this file. -->
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="theme-color" content="#bbc7cd">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23cf0000'/%3E%3Cpath d='M9 11h14M16 11v12' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../assets/viewer.css">
    <script src="../assets/viewer.js" defer></script>
</head>
<body class="viewer">
    <header class="topbar">
        <button type="button" class="contents-btn" data-action="contents" aria-controls="sidebar" aria-expanded="false"><span class="bars" aria-hidden="true"></span>Contents</button>
        <a class="logo" href="../index.html" title="All manuals"><img src="../assets/img/logo.png" alt="Toyota — all manuals"></a>
        <nav class="history" aria-label="History">
            <button type="button" class="img-btn" data-action="back" data-btn title="Back"><img src="../assets/img/back1.gif" width="38" height="23" alt="Back"></button>
            <button type="button" class="img-btn" data-action="forward" data-btn title="Forward"><img src="../assets/img/forward1.gif" width="36" height="23" alt="Forward"></button>
        </nav>
        <div class="division">{{BANNER}}</div>
    </header>

    <div class="layout">
        <aside class="sidebar" id="sidebar" aria-label="Contents">
            <div class="sidebar-head" role="search">
                <a class="home-link" href="../index.html">← All manuals</a>
                <button type="button" class="collapse-btn" data-action="reset">Collapse all</button>
                <input type="search" class="search" placeholder="Search this manual…" aria-label="Search this manual" autocomplete="off">
                <p class="search-status" aria-live="polite" hidden></p>
            </div>
            <div class="tree-scroll">
                <button type="button" class="TopItem" data-action="reset" title="Close all sections">CAMRY <small>{{SUBTITLE}} · {{COUNT}} documents</small></button>
                <nav class="tree" aria-label="Manual contents">
                    <ul>
{{TREE}}
                    </ul>
                </nav>
                <ul class="results" hidden></ul>
            </div>
            <div class="toolbar">
                <button type="button" class="img-btn" data-action="narrower" data-btn title="Narrower menu"><img src="../assets/img/widthdown1.gif" width="26" height="23" alt="Narrower"></button>
                <button type="button" class="img-btn" data-action="tree-close" data-btn title="Hide the menu"><img src="../assets/img/treeclose1.gif" width="121" height="23" alt="Tree close"></button>
                <button type="button" class="img-btn" data-action="wider" data-btn title="Wider menu"><img src="../assets/img/widthup1.gif" width="27" height="23" alt="Wider"></button>
                <button type="button" class="img-btn reset" data-action="reset" data-btn title="Close all sections"><img src="../assets/img/reset1.gif" width="64" height="23" alt="Reset"></button>
            </div>
        </aside>
        <div class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize menu" tabindex="0"></div>

        <main class="stage">
            <section class="welcome" aria-label="Welcome">
                <h1>{{WELCOME_TITLE}}</h1>
                <dl>{{WELCOME_FACTS}}</dl>
                <p><span class="only-desktop">Click the desired item from the menu on the left.</span><span class="only-touch">Tap <b>Contents</b> to browse the manual. Documents open in your phone's PDF viewer.</span></p>
                <div class="open-card" hidden>
                    <div>Selected document:</div>
                    <strong class="open-title"></strong><br>
                    <a href="#" target="_blank" rel="noopener">Open PDF</a>
                </div>
            </section>
            <iframe class="doc-frame" name="doc" title="Document viewer" hidden></iframe>
            <div class="treeopen-bar">
                <button type="button" class="img-btn" data-action="tree-open" data-btn title="Show the menu"><img src="../assets/img/treeopen1.gif" width="117" height="23" alt="Tree open"></button>
            </div>
            <p class="copyright">{{COPYRIGHT}}</p>
        </main>
    </div>
    <div class="scrim"></div>
</body>
</html>
