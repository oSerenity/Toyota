<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Camry Service Manual</title>
    <meta http-equiv="refresh" content="0; url=../index.html">
    <script>
        (function () {
            var m = /(?:^#|&)doc=([^&]+)/.exec(location.hash), url = "../index.html";
            if (m) {
                var doc = decodeURIComponent(m[1]).replace(/^\.\//, "");
                url += "#doc=" + encodeURIComponent("EWD/" + doc);
            }
            location.replace(url);
        })();
    </script>
</head>
<body>
    <p>The manuals have been merged. <a href="../index.html">Open the Camry service manual</a>.</p>
</body>
</html>
